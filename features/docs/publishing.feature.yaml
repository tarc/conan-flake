feature:
  name: publishing
  product: docs
  description: |
    The site is published as a Codeberg Page for this repository. Codeberg
    Pages is a deployment of git-pages (https://codeberg.org/git-pages/git-pages);
    for a repository site it serves the content of a branch named `pages` of
    that repository at `https://<user>.codeberg.page/<repository>/`, refreshed
    whenever a Forgejo webhook registered on the repository reports a push to
    that branch.
  prerequisites:
    - site.BUILD

components:
  BRANCH:
    description: |
      The branch whose content is served.
    requirements:
      1: The published site is the content of a branch named `pages` of this repository, with the site's entry page at the root of that branch.
      2: Publishing replaces the entire content of the `pages` branch with the freshly built site, so that a file dropped from the site stops being served.
      3: The `pages` branch carries no source of the repository, and its history is independent from the history of the source branches.

  PUBLISH:
    description: |
      Turning a build of the site into a new state of the `pages` branch.
    requirements:
      1: A single documented command builds the site and updates the `pages` branch of a checkout from that build.
      2: That command needs no credential beyond the one the contributor already uses to push to this repository.
      3: When the build of the site fails, the command leaves the `pages` branch and the working tree unchanged.
      4: The command leaves the branch that was checked out when it was invoked checked out when it returns.

  CI:
    description: |
      Publishing from continuous integration.
    requirements:
      1: Once the credential is registered, running the pipeline on demand publishes the site from the default branch.
      2: A push of a change to the documentation sources to the default branch publishes the site.
      3: When no push credential is available in its environment, the wrapper the pipeline publishes through reports that nothing was published and exits successfully, without touching the repository or leaving a remote behind.
      3-note: It is the same guard `just docs-publish` would hit, so whether to publish is decided in one place, for CI and for a contributor.

  SERVING:
    description: |
      What visitors get.
    requirements:
      1: The site is reachable at https://tarcisio.codeberg.page/conan-flake/ .
      2: A request for a path the site does not carry is answered with the site's own not-found page rather than the server's default one.
      2-note: git-pages serves `404.html` from the root of the served content for this.

  SETUP:
    description: |
      The steps that cannot be performed from a checkout because they need
      credentials or forge administration rights.
    requirements:
      1: The one-time steps needed to switch publication on are written down in the repository as an explicit checklist, naming the webhook type, its target URL and its branch filter, and the credential the pipeline expects.
      1-note: Codeberg's documented setup for a repository site is a webhook of type "Forgejo", target URL `https://<user>.codeberg.page/<repository>/`, branch filter `pages`.
      1-1: The checklist states the pipeline events the credential has to be available at, since Woodpecker offers a secret only to a run whose event the secret lists and defaults that list to `push`, `tag` and `deployment`.

constraints:
  ARTIFACT:
    description: |
      Properties of the content pushed to the `pages` branch.
    requirements:
      1: The pushed content is exactly the output of the site's Nix derivation, with no build step performed by the server.
      2: The pushed content contains no symbolic link into the Nix store and no file that is not readable and writable by its owner.
      2-note: A Nix build output is read-only and may contain store symlinks; a checkout of the branch has to be a plain, writable tree.
