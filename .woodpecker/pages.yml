# Publishes the documentation site to Codeberg Pages: it builds the site and
# updates the `pages` branch of this repository, which is the branch git-pages
# serves at https://tarcisio.codeberg.page/conan-flake/. The webhook described
# in the contributing chapter of the site is registered and that address answers
# with the published site.
#
# publishing.CI.1
# publishing.CI.2
when:
  - event: [push, manual]
    branch: main
    path:
      # The sources the site is built from, plus everything that decides what
      # publishing does: the build (`nix/packages/docs/**`, `dev/**`), the
      # scripts, and this file. Patterns are repository-relative and must not
      # start with `/`, as in `.woodpecker/checks.yml`.
      #
      # `CHANGELOG.md` is listed because the changelog chapter *is* that file:
      # the build copies it in, so a commit touching only the revision history
      # still changes the published site. `examples/**` is listed because the
      # code samples of the site are embedded from those projects. A manual run
      # reaches this workflow whatever this filter says: `Constraint.Match` in
      # `pipeline/frontend/yaml/constraint/constraint.go` evaluates the path
      # conditions only for a push or a pull request, and the branch condition
      # for every event but a tag.
      #
      # site.SOURCES.2
      include: [".woodpecker/pages.yml", "CHANGELOG.md", "dev/**", "docs/**", "examples/**", "nix/packages/docs/**", "scripts/publish-pages*.sh"]
      exclude: ["**/README.md", "**/.gitignore", "**/.envrc"]
steps:
  # The one step of this workflow, and the only thing that publishes: a push to
  # `main` touching the sources selected above publishes the site, and a manual
  # run of the workflow publishes it without a commit — which is how the site is
  # republished when nothing changed but the world around it.
  #
  # Nothing else runs the publishing wrapper here. A second, tokenless step
  # would run it again on a push with no `CODEBERG_TOKEN` in its environment and
  # print that nothing was published beside a successful publication; the
  # wrapper's credential guard is for a fork that has registered no secret yet,
  # not for this pipeline.
  #
  # Woodpecker resolves `from_secret:` while *compiling* the workflow and fails
  # compilation outright when the run may not read the named secret
  # (`secret %q not found` and `secret %q is not allowed to be used with
  # pipeline event %q`, in `pipeline/frontend/yaml/compiler/convert.go`), and a
  # step is skipped before its secrets are looked up only when its `when` does
  # not match the run at all. Since this step is reached by a push, the
  # `codeberg_token` secret has to be available at the `push` event as well as
  # at `manual`, or every push to `main` matching the filter above fails before
  # it starts. That is the first item of the activation checklist in the site's
  # contributing chapter.
  #
  # What keeps unrelated pushes from publishing is the workflow-level filter
  # above, not this step: the branch condition and the path include list.
  #
  # publishing.CI.1
  # publishing.CI.2
  - name: pages
    image: nixos/nix
    when:
      - event: [push, manual]
    environment:
      # The push credential, as a repository secret of this Woodpecker project.
      # The name on the left is the one `scripts/publish-pages-ci.sh` reads: bound
      # to any other, the secret reaches the step and the wrapper still announces
      # that nothing was published. The wrapper publishes nothing when it is
      # empty, so the decision is made by the same code path locally and in CI.
      #
      # publishing.CI.2
      # publishing.CI.3
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      # The same preamble as `.woodpecker/checks.yml`: it configures the
      # container's Nix and publishes nothing.
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - echo 'extra-substituters = https://conan-dev.cachix.org https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.asia/oss' >> /etc/nix/nix.conf
      - echo 'extra-trusted-public-keys = conan-dev.cachix.org-1:8mhLcsmkRNm2O5ot0A2G8+Cjzz0RHqLAgYV3R6Fkgfw= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=' >> /etc/nix/nix.conf
      - command -v bash > /dev/null || nix profile install nixpkgs#bash
      - command -v git > /dev/null || nix profile install nixpkgs#git
      - ./scripts/publish-pages-ci.sh
