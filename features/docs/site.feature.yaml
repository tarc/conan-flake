feature:
  name: site
  product: docs
  description: |
    conan-flake is documented by a static website generated from Markdown
    sources kept in this repository. The site is the primary entry point for
    users of the module: it says what conan-flake is, shows how to adopt it in
    each supported integration style, and explains how to work on the project
    itself. Until the site exists, `README.md` carries all of this; the site
    takes that role over.

components:
  ENTRY:
    description: |
      The page a visitor lands on when opening the site.
    requirements:
      1: The landing page states what conan-flake is and names the ways it can be consumed (plain Nix without flakes, a Nix flake, a `flake-parts` module, a devenv module).
      2: The landing page shows a minimal configuration together with the Conan configuration that configuration produces.
      3: The landing page links to the source repository and to the option reference.

  NAVIGATION:
    description: |
      How a reader moves around the site.
    requirements:
      1: Every page of the site is reachable from a persistent navigation that lists the chapters of the site.
      2: The site offers full-text search over its own pages.
      3: Every internal link, asset reference and search resource of the site resolves when the site is served from a sub-path of a host rather than from the host root.
      3-note: A Codeberg Pages repository site is served under `https://<user>.codeberg.page/<repository>/`, so any root-absolute URL emitted into a page would escape the site.

  GUIDES:
    description: |
      The chapters the site carries. Each one covers a topic that `README.md`
      covers today, so that no material is lost when `README.md` is reduced.
    requirements:
      1: There is a chapter that takes a reader from an empty directory to a working Conan configuration, using one of the flake templates.
      2: There is a chapter for the `flake-parts` integration.
      3: There is a chapter for the devenv integration, covering both the upstream `languages.cplusplus.conan` option and conan-flake used directly as a devenv module.
      4: There is a chapter for standalone usage, covering `conan-flake.lib.evalConanConfig` and `conan-flake.lib.submoduleWith`.
      5: There is a chapter covering the toolchain scenarios the project demonstrates, namely LLVM/libc++ and CUDA.
      6: There is a chapter listing the flake templates and, for each one, the command that instantiates it.
      7: There is a chapter for contributors, describing how to set up the development environment, how to run the checks, and how the generated documentation blocks are refreshed.
      8: There is a chapter carrying the external projects, tutorials and reference material the project builds upon.
      9: There is a chapter carrying the project's revision history.
      9-note: The revision history is maintained in `CHANGELOG.md`; the chapter presents that content rather than a second, divergent copy of it.

  OPTIONS_REFERENCE:
    description: |
      The per-option reference for the module's Nix options.
    requirements:
      1: The site links to the published option reference at https://flake.parts/options/conan-flake.html instead of carrying its own copy of the option descriptions.
      1-note: Option documentation is generated from the module options' own `description`/`example` attributes and published by the `flake.parts-website` build that CI already runs against this repository; a second copy here would silently go stale.

  SAMPLES:
    description: |
      The code shown by the site.
    requirements:
      1: Every Nix, Conan or shell configuration sample shown by the site is taken verbatim from a runnable project under `examples/`.
      2: A sample is updated by regenerating it from the example project it came from, never by editing the sample in place.

constraints:
  BUILD:
    description: |
      How the site is produced.
    requirements:
      1: The site is produced by a Nix derivation, built from sources tracked in this repository, and needs no network access at build time.
      2: The site is generated by mdBook.
      3: "`nix flake check ./dev` builds the site, so CI fails when the site stops building."
      4: Producing the site adds no flake input to the repository-root `flake.nix`.
      4-note: The root flake deliberately declares no inputs and therefore has no lockfile, which `.woodpecker/checks.yml` relies on and documents.

  SOURCES:
    description: |
      Where the sources of the site live.
    requirements:
      1: The Markdown sources of the site live under a single directory of the repository, tracked in git.
      2: A change under that directory triggers the repository's CI checks.
