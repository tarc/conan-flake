when:
  - event: [push, pull_request]
    branch: main
    path:
      # Patterns are matched against repository-relative paths, so they must
      # not start with `/`. `.woodpecker/*.y*ml` (rather than `*.yml`) is
      # deliberate: it also matches a future `*.yaml` file in this directory.
      #
      # `flake.lock` matches nothing today and is not meant to: the root
      # `flake.nix` declares no inputs, so Nix writes no lockfile for it. It is
      # listed so that, once the root flake does gain an input, a commit that
      # only bumps the lockfile cannot silently skip these checks. The
      # lockfiles that do exist are already covered: `dev/conan-flake.lock` by
      # `dev/**`, and any future per-scenario lockfile by `examples/**` /
      # `test/**`.
      # `docs/**` carries the documentation site's sources, built and asserted
      # over by the `dev` step below.
      #
      # site.SOURCES.2
      include: [".woodpecker/*.y*ml", "dev/**", "docs/**", "examples/**", "flake.lock", "flake.nix", "nix/**", "test/**", "vira.hs"]
      exclude: ["**/README.md", "**/.gitignore", "**/.envrc"]
steps:
  - name: dev
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - echo 'extra-substituters = https://conan-dev.cachix.org https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.asia/oss' >> /etc/nix/nix.conf
      - echo 'extra-trusted-public-keys = conan-dev.cachix.org-1:8mhLcsmkRNm2O5ot0A2G8+Cjzz0RHqLAgYV3R6Fkgfw= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=' >> /etc/nix/nix.conf
      - nix flake check ./dev  --override-input conan-flake . --show-trace --no-pure-eval
  - name: tests
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - echo 'extra-substituters = https://conan-dev.cachix.org https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.asia/oss' >> /etc/nix/nix.conf
      - echo 'extra-trusted-public-keys = conan-dev.cachix.org-1:8mhLcsmkRNm2O5ot0A2G8+Cjzz0RHqLAgYV3R6Fkgfw= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=' >> /etc/nix/nix.conf
      - nix --show-trace --accept-flake-config run github:juspay/vira --no-pure-eval -- ci -b
    depends_on: [dev]
  - name: flake.parts-website
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - echo 'extra-substituters = https://conan-dev.cachix.org https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.asia/oss' >> /etc/nix/nix.conf
      - echo 'extra-trusted-public-keys = conan-dev.cachix.org-1:8mhLcsmkRNm2O5ot0A2G8+Cjzz0RHqLAgYV3R6Fkgfw= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=' >> /etc/nix/nix.conf
      - nix build github:hercules-ci/flake.parts-website --extra-experimental-features pipe-operators --show-trace --override-input conan-flake .
    depends_on: [tests]
