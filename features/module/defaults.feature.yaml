feature:
  name: defaults
  product: module

components:
  PROFILE:
    description: Attribute set of configurations representing defaults to be used for all profiles.
    requirements:
      1: The actual type of each attribute value is deferred in order to allow for lazy evaluation.
      2: For the attribute-set-shaped sections (settings, options, toolRequires, conf, replaceRequires, replaceToolRequires, platformRequires, platformToolRequires), every entry is expected to be wrapped in `lib.mkDefault`, since `defaults.profiles` is merged into every profile's own configuration via the module system's native option priority - an entry assigned without `lib.mkDefault` is at normal priority, indistinguishable from a profile's own entry, and conflicts with (rather than yields to) a profile that assigns the same entry, including when it removes it with `null`.
      2-1: buildEnv and runEnv are list-shaped, not attribute-set-shaped, and are exempt from requirement 2: these two sections are merged against a profile's own entries the same way regardless of `lib.mkDefault` (profile.PROFILE.2), so wrapping them in `lib.mkDefault` is neither required nor harmful.
      2-1-note: A list-typed option's priority is all-or-nothing, not per-entry (unlike the attribute-set-shaped sections requirement 2 covers). So, even in principle, `lib.mkDefault` could not substitute for requirement 2's per-entry priority mechanism for these two sections, which is why they are merged independently of it instead.
