# mdBook configuration for the conan-flake documentation site.
#
# site.BUILD.2
# site.SOURCES.1

[book]
title = "conan-flake"
description = "A module to ease the integration of the Conan C/C++ package manager in the Nix ecosystem"
authors = ["Tarcisio Genaro Rodrigues"]
language = "en"
src = "src"

[build]
# The site is built offline from the sources tracked in this repository; nothing
# is fetched while building.
#
# site.BUILD.1
create-missing = false

[output.html]
git-repository-url = "https://codeberg.org/tarcisio/conan-flake"
edit-url-template = "https://codeberg.org/tarcisio/conan-flake/_edit/main/docs/{path}"

# The site is served from a sub-path of the host
# (`https://tarcisio.codeberg.page/conan-flake/`). Ordinary pages only ever emit
# relative links, but the generated `404.html` is reachable under any depth and
# therefore links back with absolute URLs built from `site-url`; without it those
# URLs would point at the host root and escape the site.
#
# site.NAVIGATION.3
site-url = "/conan-flake/"

[output.html.search]
# Full-text search over the site's own pages, served from the site itself
# (`searchindex.js`/`searchindex.json`), so it keeps working under a sub-path.
#
# site.NAVIGATION.2
enable = true
